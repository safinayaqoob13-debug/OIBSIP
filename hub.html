<title>Safina Yaqoob | OIBSIP Internship Projects</title>
<style>
:root{
  --cream:#FBF9F3; --paper:#F3EFE2; --olive:#5B6B2F; --olive-dark:#3F4A20; --olive-soft:#E4E8D2;
  --ink:#2B2B22; --muted:#66665A; --line:#D9D6C5;
  --font:"Times New Roman",Times,serif;
  --radius:8px;
}
body{margin:0;font-family:var(--font);background:var(--cream);color:var(--ink);padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.container{max-width:700px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:2.5rem;box-shadow:0 4px 12px rgba(0,0,0,.03);text-align:center}
h1{color:var(--olive-dark);margin-top:0;font-size:2.2rem}
p{color:var(--muted);margin-bottom:2rem}
.links{display:flex;flex-direction:column;gap:1rem}
.btn{display:block;padding:1rem;background:var(--olive);color:#fff;text-decoration:none;font-weight:bold;border-radius:var(--radius);transition:background .25s ease}
.btn:hover{background:var(--olive-dark)}
.btn.secondary{background:transparent;color:var(--olive-dark);border:2px solid var(--olive)}
.btn.secondary:hover{background:var(--olive);color:#fff}
</style>
</head>

<div class="container">
